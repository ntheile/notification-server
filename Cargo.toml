[package]
name = "mutiny-notifications"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mutiny-notifications"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.6.16", features = ["headers"] }
chrono = { version = "0.4.26", features = ["serde"] }
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono", "numeric"] }
diesel_migrations = "2.1.0"
dotenv = "0.15.0"
futures = "0.3.28"
log = "0.4.20"
hex = "0.4.3"
jwt-compact = { version = "0.8.0", features = ["es256k"] }
jsonwebtoken = "9.3.0"
nostr = { version = "0.24.0", default-features = false, features = ["nip47"] }
nostr-sdk = "0.24.0"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls"] }
sha2 = { version = "0.10", default-features = false }
secp256k1 = "0.28.0"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.12.0", features = ["full"] }
tower-http = { version = "0.4.0", features = ["cors"] }
web-push = "0.10.0"
